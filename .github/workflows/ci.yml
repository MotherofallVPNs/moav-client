name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  proxy-core:
    name: proxy-core (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25"]
    defaults:
      run:
        working-directory: proxy-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: proxy-core/go.sum

      - name: go vet
        run: go vet ./...

      - name: cross-compile (windows/darwin) — catch OS-specific breakage
        # proxy-core is meant to build on Windows/macOS too (issue #7 was a
        # Windows-only syscall breakage that the Linux build missed).
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...

      - name: golangci-lint (findings warn-only)
        # Findings don't fail the job yet (--issues-exit-code=0), but the linter
        # failing to run does: no continue-on-error, which hid a dead linter.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: must be built with a Go >= the go.mod version, or it exits 3.
          version: v2.15.0
          working-directory: proxy-core
          args: --issues-exit-code=0

      - name: go test (race + coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - name: coverage summary
        run: |
          go tool cover -func=cover.out | tail -1
          echo "--- per-package ---"
          go tool cover -func=cover.out | awk '{print $1, $3}' | sed 's|github.com/[^/]*/[^/]*/proxy-core/||' | sort -u | tail -40

      - name: go build
        run: go build ./...

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: proxy-core/cover.out
          if-no-files-found: ignore

  web-ui:
    name: web-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci

      - name: vitest (unit tests)
        run: npm test

      - name: tsc + vite build
        run: npm run build

  scripts:
    name: scripts (shellcheck + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash -n syntax check
        run: |
          for f in install.sh moav-client; do
            bash -n "$f" && echo "syntax ok: $f"
          done

      - name: version drift gate (single source of truth)
        run: bash tests/version-sync-test.sh

      - name: shellcheck (warn-only)
        # We don't fail the build on shellcheck — it's noisy on heredocs —
        # but we surface findings.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh moav-client || true

  compose:
    name: docker compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker compose config
        run: |
          # Validate the stack definition parses + interpolates. Seed a .env so
          # variable interpolation resolves (values are irrelevant here).
          [ -f .env ] || cp .env.example .env 2>/dev/null || true
          docker compose config >/dev/null && echo "docker-compose.yml is valid"
