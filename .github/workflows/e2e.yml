name: e2e

# Live end-to-end test: bring the moav-client stack up against a REAL MoaV
# server bundle and prove traffic is tunnelled (endpoints parse → /api/probe
# validates → a fetch through SOCKS5 :1080 exits from the server's IP).
#
# NOT on the per-PR path — it needs Docker, the ~11-image client stack, and a
# reachable MoaV server. Runs on a SELF-HOSTED runner (label `moav-client-e2e`).
# Setup + the cross-repo "runner keeps a server up" plan: docs/devdocs/E2E-TESTING.md
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: "Keep client logs as an artifact even on success (always kept on failure)"
        type: boolean
        default: false
      bundle_b64:
        description: "Base64 of a MoaV bundle .zip — overrides the secrets. On the server: moav user base64 <user>. (NOT 'moav user sub' — that is a subscription, see sub_url.)"
        type: string
        default: ""
      sub_url:
        description: "Subscription to test — overrides the secrets. An http(s) subscription URL, a moav:// URI, or the output of: moav user sub <user>"
        type: string
        default: ""
      exit_ip:
        description: "Expected server egress IP for the assertion — overrides the secret (leave empty to accept any proxied exit)"
        type: string
        default: ""
      full_logs:
        description: "Same as verbose (kept for compatibility)"
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: moav-client-e2e-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, moav-client-e2e]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dispatch inputs are read from the event payload and masked here rather
      # than mapped into `env:` — GitHub echoes unmasked inputs in every step
      # header, which would publish the bundle's credentials in the run log.
      - name: Resolve the test config (dispatch input overrides the secrets)
        env:
          SECRET_SUB_URL: ${{ secrets.MOAV_TEST_SUB_URL }}
          SECRET_BUNDLE_B64: ${{ secrets.MOAV_TEST_BUNDLE_B64 }}
          SECRET_EXIT_IP: ${{ secrets.MOAV_TEST_EXIT_IP }}
        run: |
          docker --version && docker compose version
          input() { jq -r --arg k "$1" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH"; }
          sub=$(input sub_url); b64=$(input bundle_b64); ip=$(input exit_ip)
          # add-mask is per line, and a pasted URI list has several.
          printf '%s\n' "$sub" "$b64" "$ip" | while IFS= read -r l; do
            if [ -n "$l" ]; then echo "::add-mask::$l"; fi
          done
          # A dispatched config replaces the standing secrets as a set, so a
          # sub_url input is never shadowed by the bundle secret (or its exit IP).
          if [ -z "$sub$b64" ]; then
            sub=$SECRET_SUB_URL; b64=$SECRET_BUNDLE_B64; ip=${ip:-$SECRET_EXIT_IP}
          fi
          if [ -z "$sub$b64" ]; then
            echo "::error::provide a config: the bundle_b64 / sub_url dispatch input, or the MOAV_TEST_SUB_URL / MOAV_TEST_BUNDLE_B64 secret"; exit 1
          fi
          if [ -n "$b64" ]; then
            if printf '%s' "$b64" | base64 -d > /tmp/moav-e2e-bundle.zip 2>/dev/null \
               && [ "$(head -c2 /tmp/moav-e2e-bundle.zip)" = "PK" ]; then
              echo "MOAV_TEST_BUNDLE=/tmp/moav-e2e-bundle.zip" >> "$GITHUB_ENV"
            else
              # `moav user sub` output pasted into bundle_b64: valid base64, not a zip.
              echo "::notice::bundle_b64 is not a zip — treating it as subscription content (a bundle zip comes from: moav user base64 <user>)"
              rm -f /tmp/moav-e2e-bundle.zip
              sub=$b64
            fi
          fi
          { echo "MOAV_TEST_SUB_URL<<__E2E_EOF__"; printf '%s\n' "$sub"; echo "__E2E_EOF__"; } >> "$GITHUB_ENV"
          echo "MOAV_TEST_EXIT_IP=$ip" >> "$GITHUB_ENV"

      # The harness snapshots (redacted) compose logs into the artifact dir
      # itself, before it tears the stack down.
      - name: Run the client e2e
        env:
          E2E_KEEP_LOGS: ${{ (inputs.verbose || inputs.full_logs) && '1' || '' }}
        run: ART_DIR="$PWD/e2e-artifacts" bash tests/e2e-client.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moav-client-e2e
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Teardown (reclaim workspace)
        if: always()
        run: |
          docker compose --profile '*' down -v 2>/dev/null || true
          rm -rf config.yaml /tmp/moav-e2e-bundle.zip data/e2e-bundle data/e2e-sub 2>/dev/null || true
          # MoaV/client containers can leave root-owned files in bind mounts;
          # hand the workspace back so the next checkout can clean it.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          # Generated sing-box/xray/sidecar configs embed the bundle's credentials.
          rm -rf data/*.json data/sidecar-configs 2>/dev/null || true
